
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo Pengembalian Barang</title>
<style>
body{font-family:Arial;background:#f5f5f5;padding:20px}
.card{background:white;padding:22px;border-radius:12px;max-width:420px;margin:auto}
h2{color:#ee4d2d}
.notice{background:#fff3cd;padding:12px;font-size:14px}
input,button{box-sizing:border-box;width:100%;padding:12px;margin-top:12px}
button{background:#ee4d2d;color:white;border:0;border-radius:6px}
</style>
</head>
<body>
<div class="card">
<p class="notice">DEMO EDUKASI — Bukan situs resmi Shopee.</p>
<h2>Pengembalian Barang</h2>
<p>Masukkan nomor resi contoh untuk mencoba simulasi.</p>
<form id="demo">
<input id="resi" placeholder="Contoh: DEMO123456" required>
<button type="submit">Coba Simulasi</button>
</form>
<p id="hasil"></p>
</div>
<script>
document.getElementById("demo").onsubmit=function(e){
e.preventDefault();
document.getElementById("hasil").textContent=
"Simulasi berhasil! Nomor contoh: "+
document.getElementById("resi").value;
};
</script>
</body>
</html>
